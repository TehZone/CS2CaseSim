<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self' https: wss: http://localhost:* ws://localhost:* http://127.0.0.1:* ws://127.0.0.1:*">
  <title>CS2 Case Simulator</title>
  <link rel="stylesheet" href="css/fonts.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/features.css">
  <link rel="stylesheet" href="css/loadout.css">
  <link rel="stylesheet" href="css/play.css">
  <link rel="stylesheet" href="css/admin.css">
  <link rel="stylesheet" href="css/itemindex.css">
  <link rel="stylesheet" href="css/changelog.css">
  <script type="importmap">
    { "imports": { "three": "./vendor/three.module.js", "three/addons/": "./vendor/addons/" } }
  </script>
</head>
<body>
  <div id="menu-bg" aria-hidden="true"><div class="vista"></div></div>
  <div id="app">
    <!-- The main menu strip like CS2's Panorama: PLAY, the main sections as icons and the rest under More (menu.js swaps in
         CS2's own icons from the player's install; the drawn ones stand in without it), then your profile and settings. -->
    <header id="topbar">
      <div class="brand" title="CS2 Case Simulator">
        <svg viewBox="0 0 32 32" width="24" height="24" aria-hidden="true"><path d="M4 10l12-6 12 6v12l-12 6-12-6z" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"/><path d="M16 10l1.8 3.9 4.2.4-3.2 2.8 1 4.1-3.8-2.2-3.8 2.2 1-4.1-3.2-2.8 4.2-.4z" fill="currentColor"/></svg>
      </div>
      <nav id="nav">
        <button data-page="play" class="nav-play"><i class="ico" data-icon="play"><svg viewBox="0 0 32 32"><path d="M8 4.5l19 11.5-19 11.5z"/></svg></i><span>Play</span></button>
        <span class="nav-sep" aria-hidden="true"></span>
        <button data-page="cases" aria-label="Cases" data-tip="Cases"><i class="ico" data-icon="crate"><svg viewBox="0 0 32 32"><path d="M12.6 4.6h6.8v3.6h-1.8V6.4h-3.2v1.8h-1.8z"/><path fill-rule="evenodd" d="M4.8 8.2h22.4A1.8 1.8 0 0 1 29 10v15.4a1.8 1.8 0 0 1-1.8 1.8H4.8A1.8 1.8 0 0 1 3 25.4V10a1.8 1.8 0 0 1 1.8-1.8zM3 13.4h4.6v1.5H3zm6.4 0h13.2v1.5H9.4zm15 0H29v1.5h-4.6zM7.6 8.2h1.8v19H7.6zm15 0h1.8v19h-1.8zM16 16.4l3.2 3.2-3.2 3.2-3.2-3.2z"/></svg></i><span class="lbl">Cases</span></button>
        <button data-page="inventory" aria-label="Inventory" data-tip="Inventory"><i class="ico" data-icon="inventory"><svg viewBox="0 0 32 32"><path fill-rule="evenodd" d="M12 6h8a2 2 0 0 1 2 2v2h4.5a1.5 1.5 0 0 1 1.5 1.5v13a1.5 1.5 0 0 1-1.5 1.5h-21A1.5 1.5 0 0 1 4 24.5v-13A1.5 1.5 0 0 1 5.5 10H10V8a2 2 0 0 1 2-2zm0 2v2h8V8zM4 16h24v1.6H4z"/></svg></i><span class="lbl">Inventory</span><span class="pill" id="inv-count">0</span></button>
        <button data-page="market" aria-label="Market" data-tip="Market"><i class="ico" data-icon="shoppingcart"><svg viewBox="0 0 32 32"><path d="M2.5 5h4.2l1.1 3.2H29l-3.3 10.6H10.4L6.9 7.6 5.6 7.4H2.5z"/><circle cx="12" cy="24.2" r="2.3"/><circle cx="23.5" cy="24.2" r="2.3"/></svg></i><span class="lbl">Market</span></button>
        <button data-page="index" aria-label="Index" data-tip="Index"><i class="ico" data-icon="index"><svg viewBox="0 0 32 32"><path fill-rule="evenodd" d="M6 4h16a4 4 0 0 1 4 4v18a2 2 0 0 1-2 2H8a4 4 0 0 1-4-4V6a2 2 0 0 1 2-2zm0 2v15.3c.6-.2 1.3-.3 2-.3h15V8a2 2 0 0 0-2-2zm2 17a1.5 1.5 0 0 0 0 3h15v-3z"/><path d="M14.5 8.5l1.5 3 3.3.5-2.4 2.3.6 3.3-3-1.6-3 1.6.6-3.3L9.7 12l3.3-.5z"/></svg></i><span class="lbl">Index</span><span class="pill" id="index-count" hidden>0</span></button>
        <!-- More: the other sections in a dropdown (menu.js), with your inventory's value on top -->
        <div class="nav-more">
          <button type="button" class="more-btn" aria-haspopup="menu" aria-expanded="false" aria-label="More" data-tip="More"><i class="ico" data-icon="menu"><svg viewBox="0 0 32 32"><path d="M5 8h22v2.6H5zM5 14.7h22v2.6H5zM5 21.4h22V24H5z"/></svg></i><span class="more-cur"></span><span class="lbl">More</span></button>
          <div class="more-panel" role="menu">
            <div class="more-wallet"><div>Inventory value<b id="net-worth">$0.00</b></div></div>
            <button data-page="tradeup" role="menuitem"><i class="ico" data-icon="trade_up"><svg viewBox="0 0 32 32"><path d="M16 4l10 10h-6v5h-8v-5H6z"/><path d="M12 21h8v2.4h-8zM12 25.5h8v2.4h-8z"/></svg></i><span class="mlbl">Trade Up</span></button>
            <button data-page="armory" role="menuitem"><i class="ico" data-icon="xpshop_star"><svg viewBox="0 0 32 32"><path d="M16 3.5l3.8 8 8.7 1-6.4 6 1.7 8.6L16 22.9l-7.8 4.2 1.7-8.6-6.4-6 8.7-1z"/></svg></i><span class="mlbl">Armory</span><span class="pill star" id="star-count">0</span></button>
            <button data-page="database" role="menuitem"><i class="ico" data-icon="stats_grid"><svg viewBox="0 0 32 32"><path fill-rule="evenodd" d="M4.5 6h23v20h-23zm2 2v4h5V8zm7 0v4h12V8zm-7 6v4h5v-4zm7 0v4h12v-4zm-7 6v4h5v-4zm7 0v4h12v-4z"/></svg></i><span class="mlbl">Item Database</span></button>
            <button data-page="gamble" role="menuitem"><i class="ico" data-icon="coin_stack"><svg viewBox="0 0 32 32"><ellipse cx="12.5" cy="8.5" rx="8" ry="3.4"/><path d="M4.5 11c1.5 1.7 4.5 2.7 8 2.7s6.5-1 8-2.7v3c0 1.9-3.6 3.4-8 3.4s-8-1.5-8-3.4z"/><path d="M4.5 16.6c1.5 1.7 4.5 2.7 8 2.7.6 0 1.2 0 1.8-.1v3.3c-.6.1-1.2.1-1.8.1-4.4 0-8-1.5-8-3.4z"/><ellipse cx="21" cy="20" rx="7.5" ry="3.2"/><path d="M13.5 22.4c1.4 1.6 4.2 2.6 7.5 2.6s6.1-1 7.5-2.6v2.9c0 1.8-3.4 3.2-7.5 3.2s-7.5-1.4-7.5-3.2z"/></svg></i><span class="mlbl">Gamble</span></button>
            <button data-page="trade" class="online-only" role="menuitem"><i class="ico" data-icon="trade"><svg viewBox="0 0 32 32"><path d="M21.5 3.5L28 10l-6.5 6.5V12H7.5V8h14zM10.5 15.5V20h14v4h-14v4.5L4 22z"/></svg></i><span class="mlbl">Trade</span></button>
            <!-- staff on an online server (moderators and admins, from the account's Discord roles): admin.js -->
            <button data-page="admin" class="staff-only" role="menuitem"><i class="ico" data-icon="admin"><svg viewBox="0 0 32 32"><path fill-rule="evenodd" d="M16 3L27 7V15.2C27 21.8 22.4 27 16 29C9.6 27 5 21.8 5 15.2V7ZM16 6.2L8 9.1V15.2C8 20 11.3 23.9 16 25.8C20.7 23.9 24 20 24 15.2V9.1ZM16 10.5L17.6 13.8L21.2 14.2L18.5 16.6L19.3 20.2L16 18.4L12.7 20.2L13.5 16.6L10.8 14.2L14.4 13.8Z"/></svg></i><span class="mlbl">Admin</span></button>
          </div>
        </div>
      </nav>
      <div class="top-right">
        <!-- your level (and Service Medal) with its XP bar, and the level-up rewards waiting (profile.js) -->
        <button class="prof-chip" id="prof" aria-label="Your level"></button>
        <!-- your profile, like CS2's corner: avatar (with the offline / online dot), name and balance -->
        <button class="account" id="account" title="Offline / online play"><span class="avatar"><i class="ico" data-icon="profile"><svg viewBox="0 0 32 32"><circle cx="16" cy="11.5" r="5.6"/><path d="M5 29c1-6.4 5.4-9.6 11-9.6S26 22.6 27 29z"/></svg></i><span class="dot"></span></span><span class="who"><span id="account-name">Offline</span><span class="balance" id="balance">$0.00</span></span></button>
        <!-- every update to the game, offline and online (changelog.js) -->
        <button data-page="changelog" class="nav-icon nav-changelog" aria-label="Changelog" data-tip="Every update to the game"><i class="ico"><svg viewBox="0 0 32 32"><path fill-rule="evenodd" d="M7 3h13l6 6v20H7zM19 5.4V10h4.6zM11 13v2h11v-2zM11 18v2h11v-2zM11 23v2h8v-2z"/></svg></i><span class="lbl">Changelog</span></button>
        <!-- friends, chat and the NPC traders (offline: community.js), with unread messages and friend requests -->
        <button data-page="community" class="nav-icon offline-only" aria-label="Friends" data-tip="Friends &amp; Chat"><i class="ico" data-icon="player"><svg viewBox="0 0 32 32"><circle cx="12" cy="11" r="5"/><path d="M3 27c.8-5.6 4.3-8.6 9-8.6s8.2 3 9 8.6z"/><circle cx="22.5" cy="10" r="4"/><path d="M20.8 17.4c4.5-.4 7.6 2.3 8.2 7.6h-5.4c-.4-3-1.4-5.5-2.8-7.6z"/></svg></i><span class="lbl">Friends</span><span class="pill msg" id="msg-count" hidden>0</span></button>
        <button data-page="stats" class="nav-icon" aria-label="Settings" data-tip="Settings"><i class="ico" data-icon="settings"><svg viewBox="0 0 32 32"><path fill-rule="evenodd" d="M13.6 3h4.8l.7 3.4 2.3 1 2.9-1.9 3.4 3.4-1.9 2.9 1 2.3 3.4.7v4.8l-3.4.7-1 2.3 1.9 2.9-3.4 3.4-2.9-1.9-2.3 1-.7 3.4h-4.8l-.7-3.4-2.3-1-2.9 1.9-3.4-3.4 1.9-2.9-1-2.3L3 18.4v-4.8l3.4-.7 1-2.3-1.9-2.9 3.4-3.4 2.9 1.9 2.3-1zM16 11.5a4.5 4.5 0 1 0 0 9 4.5 4.5 0 0 0 0-9z"/></svg></i><span class="lbl">Settings</span></button>
      </div>
    </header>
    <main id="page"><div class="boot">Loading CS2 item database…</div></main>
  </div>
  <div id="modal-root"></div>
  <div id="toasts"></div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
